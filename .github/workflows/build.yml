name: Build Devises

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install ARM toolchain
        run: |
          sudo apt-get update
          sudo apt-get install -y gcc-arm-none-eabi binutils-arm-none-eabi

      - name: Install Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install nwlink
        run: npm install -g nwlink@1.0.0

      - name: Get EADK flags
        run: |
          echo "=== nwlink version ==="
          nwlink --version || true
          echo "=== eadk-cflags-device output ==="
          nwlink eadk-cflags-device
          echo "=== end ==="

      - name: Build
        run: make -C devises NWLINK="nwlink"

      - name: Show size
        run: |
          ls -la devises/build/
          echo "=== Taille finale ==="
          stat -c '%s bytes' devises/build/Devises.nwa

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: Devises-nwa
          path: devises/build/Devises.nwa
      
